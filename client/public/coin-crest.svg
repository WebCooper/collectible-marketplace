<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="innerShine" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>
  </defs>
  <!-- Outer serrated coin edge -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="3,3" />
  <!-- Coin rim -->
  <circle cx="100" cy="100" r="88" fill="#12151f" stroke="url(#goldGradient)" stroke-width="6" />
  <circle cx="100" cy="100" r="78" fill="url(#innerShine)" />
  <!-- Center Emblem -->
  <polygon points="100,45 112,78 148,78 118,98 129,132 100,112 71,132 82,98 52,78 88,78" fill="url(#goldGradient)" />
  <circle cx="100" cy="94" r="14" fill="#0c0f17" stroke="url(#goldGradient)" stroke-width="2" />
  <!-- Text Ring -->
  <path id="textCircle" d="M 35 100 A 65 65 0 0 1 165 100" fill="none" />
  <text fill="#d4af37" font-family="serif" font-size="9" font-weight="bold" letter-spacing="2">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">RELICVAULT • NUMISMATICS</textPath>
  </text>
</svg>
