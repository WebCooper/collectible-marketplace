server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Container / load balancer health probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change, so cache them for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Always revalidate the entry page so a new deploy is picked up
    location = /index.html {
        expires -1;
    }

    # The app navigates with URL fragments; this fallback covers direct links
    location / {
        try_files $uri $uri/ /index.html;
    }
}
